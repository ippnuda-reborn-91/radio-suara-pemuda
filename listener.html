<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listener Ippnuda Radio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); }
        .bg-gradient { background: radial-gradient(circle at center, #064e3b, #000000); }
        .playing-active { background: rgba(34, 197, 94, 0.2); color: #22c55e; border-left: 4px solid #22c55e; }
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
        .pulse-live { animation: pulse-green 2s infinite; }
    </style>
</head>
<body class="bg-gradient min-h-screen text-white flex flex-col items-center p-6 font-sans overflow-x-hidden">

    <div class="w-full max-w-sm flex justify-between items-center mb-6 mt-2 shrink-0">
        <div>
            <h1 class="text-xl font-bold tracking-tighter text-green-500">IPPNUDA <span class="text-white">RADIO</span></h1>
            <p id="now-playing-text" class="text-[9px] opacity-50 uppercase tracking-[0.2em] truncate w-40">Ready to play</p>
        </div>
        <div id="status-badge" class="px-3 py-1 bg-zinc-800 border border-white/10 rounded-full text-[8px] font-bold uppercase tracking-widest shrink-0">Offline</div>
    </div>

    <div class="w-full max-w-sm glass border border-white/10 rounded-[2.5rem] overflow-hidden shadow-2xl flex flex-col mb-6">
        <div class="p-8 text-center border-b border-white/5 relative shrink-0">
            <div id="live-tag" class="hidden absolute top-5 right-8 flex items-center space-x-1">
                <span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-ping"></span>
                <span class="text-[8px] font-bold text-red-500 uppercase tracking-tighter">Live</span>
            </div>
            <button id="btn-master" class="w-20 h-20 bg-green-600 rounded-full flex items-center justify-center mx-auto transition-all active:scale-90 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                </svg>
            </button>
            <p id="main-status" class="mt-4 text-[10px] font-bold uppercase tracking-widest text-green-400">Cek Siaran Langsung</p>
        </div>

        <div class="bg-black/20 flex flex-col" style="max-height: 250px;">
            <h2 class="text-[9px] opacity-30 uppercase tracking-[0.2em] py-4 text-center font-bold">Daftar Putar</h2>
            <div id="playlist-container" class="space-y-1 overflow-y-auto custom-scrollbar px-4 pb-6">
                </div>
        </div>
    </div>

    <div class="w-full max-w-sm grid grid-cols-3 gap-3 mb-8 shrink-0">
        <button onclick="showPopup('Jadwal')" class="py-3 glass border border-white/10 rounded-2xl text-[9px] font-bold uppercase tracking-widest opacity-70 hover:opacity-100 transition-all">Jadwal</button>
        <button onclick="showPopup('Atensi')" class="py-3 glass border border-white/10 rounded-2xl text-[9px] font-bold uppercase tracking-widest opacity-70 hover:opacity-100 transition-all">Atensi</button>
        <button onclick="showPopup('Kontak')" class="py-3 glass border border-white/10 rounded-2xl text-[9px] font-bold uppercase tracking-widest opacity-70 hover:opacity-100 transition-all">Kontak</button>
    </div>

    <div id="popup" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden p-6">
        <div class="w-full max-w-xs glass border border-white/10 p-8 rounded-[2rem] text-center shadow-2xl">
            <h3 id="popup-title" class="text-green-500 font-bold uppercase tracking-[0.2em] mb-4 text-sm">TITLE</h3>
            <p class="text-xs opacity-60 leading-loose">Mohon maaf, fitur ini masih dalam proses pengembangan.</p>
            <button onclick="closePopup()" class="mt-8 px-8 py-3 bg-zinc-800 rounded-full text-[10px] font-bold uppercase tracking-widest border border-white/5">Tutup</button>
        </div>
    </div>

    <audio id="audio-engine" crossorigin="anonymous" playsinline></audio>

    <script>
        const HOST_ID = "04021991";
        const peer = new Peer();
        const audioEngine = document.getElementById('audio-engine');
        const badge = document.getElementById('status-badge');
        const listContainer = document.getElementById('playlist-container');
        const nowPlaying = document.getElementById('now-playing-text');
        const mainStatus = document.getElementById('main-status');
        const liveTag = document.getElementById('live-tag');
        const btnMaster = document.getElementById('btn-master');

        async function loadPlaylist() {
            try {
                const response = await fetch('playlist.json?t=' + Date.now());
                const tracks = await response.json();
                renderPlaylist(tracks);
            } catch (err) {
                listContainer.innerHTML = "<p class='text-center text-[9px] opacity-20 py-4 font-bold uppercase'>Lagu tidak tersedia</p>";
            }
        }

        function renderPlaylist(tracks) {
            listContainer.innerHTML = "";
            tracks.forEach((track, i) => {
                const div = document.createElement('div');
                div.className = "p-4 glass border border-white/5 rounded-2xl cursor-pointer flex items-center space-x-4 transition-all mb-1";
                div.innerHTML = `
                    <span class="text-[9px] opacity-20 font-mono">${(i+1).toString().padStart(2,'0')}</span>
                    <span class="text-[11px] font-medium truncate">${track.title}</span>
                `;
                div.onclick = () => playOffline(track, div);
                listContainer.appendChild(div);
            });
        }

        function playOffline(track, el) {
            if(audioEngine.srcObject) audioEngine.srcObject = null;
            audioEngine.src = track.url;
            audioEngine.play().then(() => {
                nowPlaying.innerText = track.title;
                mainStatus.innerText = "Playlist Mode";
                mainStatus.className = "mt-4 text-[10px] font-bold uppercase tracking-widest text-blue-400";
                document.querySelectorAll('#playlist-container div').forEach(d => d.classList.remove('playing-active'));
                el.classList.add('playing-active');
                badge.innerText = "Offline";
                badge.className = "px-3 py-1 bg-zinc-800 border border-white/10 rounded-full text-[8px] font-bold uppercase tracking-widest";
                liveTag.classList.add('hidden');
                btnMaster.classList.remove('pulse-live');
            });
        }

        function connectLive() {
            badge.innerText = "Mencari...";
            badge.className = "px-3 py-1 bg-blue-600 rounded-full text-[8px] font-bold uppercase tracking-widest";
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                const call = peer.call(HOST_ID, stream);
                const timeout = setTimeout(() => {
                    if (badge.innerText !== "ONLINE") {
                        badge.innerText = "Offline";
                        badge.className = "px-3 py-1 bg-zinc-800 border border-white/10 rounded-full text-[8px] font-bold uppercase tracking-widest";
                        mainStatus.innerText = "Siaran Tidak Aktif";
                    }
                }, 6000);
                call.on('stream', (remoteStream) => {
                    clearTimeout(timeout);
                    badge.innerText = "ONLINE";
                    badge.className = "px-3 py-1 bg-green-600 rounded-full text-[8px] font-bold uppercase tracking-widest pulse-live";
                    mainStatus.innerText = "Live Terhubung";
                    mainStatus.className = "mt-4 text-[10px] font-bold uppercase tracking-widest text-green-400";
                    nowPlaying.innerText = "IPPNUDA RADIO LIVE";
                    liveTag.classList.remove('hidden');
                    btnMaster.classList.add('pulse-live');
                    audioEngine.srcObject = remoteStream;
                    audioEngine.play();
                    document.querySelectorAll('#playlist-container div').forEach(d => d.classList.remove('playing-active'));
                });
            });
        }

        btnMaster.onclick = connectLive;
        function showPopup(title) {
            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup').classList.remove('hidden');
        }
        function closePopup() {
            document.getElementById('popup').classList.add('hidden');
        }

        loadPlaylist();
    </script>
</body>
</html>
