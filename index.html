<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Mixer - Ippnuda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .bg-gradient { background: radial-gradient(circle at top, #064e3b, #000000); }
    </style>
</head>
<body class="bg-gradient min-h-screen text-white flex flex-col items-center justify-center p-6">

    <main class="w-full max-w-md glass rounded-[2.5rem] p-8 border border-white/10 shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold tracking-widest text-green-400 uppercase">Ippnuda Mixer Pro</h1>
            <p class="text-[10px] opacity-40 uppercase">Pendengar: <span id="count">0</span></p>
        </div>

        <div class="space-y-4">
            <div class="bg-black/30 p-4 rounded-2xl border border-white/5">
                <input type="file" id="audio-file" accept="audio/*" class="text-[10px] mb-4 w-full">
                <div class="flex space-x-2">
                    <button id="btn-play" class="flex-1 py-3 bg-blue-600 rounded-xl text-[10px] font-bold uppercase">Play / Ganti</button>
                    <button id="btn-stop" class="flex-1 py-3 bg-gray-700 rounded-xl text-[10px] font-bold uppercase">Stop</button>
                </div>
                <input type="range" id="vol" min="0" max="1" step="0.1" value="0.5" class="w-full mt-4 accent-green-500">
            </div>

            <button id="btn-mic" class="w-full py-4 bg-gray-700 rounded-2xl font-bold uppercase text-xs">Aktifkan Mic</button>
            <button id="btn-radio" class="w-full py-4 bg-green-700 rounded-2xl font-bold uppercase text-xs">Aktifkan Radio</button>
            
            <div id="debug" class="text-[9px] text-yellow-500 font-mono mt-4 p-2 bg-black/50 rounded h-16 overflow-y-auto">
                Status: Menunggu instruksi...
            </div>

            <button onclick="location.reload()" class="w-full py-2 text-[10px] opacity-30 uppercase underline">Reset Aplikasi</button>
        </div>
    </main>

    <audio id="audio-tag" hidden></audio>

    <script>
        const RADIO_ID = "04021991";
        let peer, audioCtx, dest, micStream, musicNode;
        const debug = document.getElementById('debug');
        const audioTag = document.getElementById('audio-tag');

        function log(msg) { debug.innerText = msg; console.log(msg); }

        async function init() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                dest = audioCtx.createMediaStreamDestination();
                log("Audio Engine Aktif");
            }
            if (audioCtx.state === 'suspended') await audioCtx.resume();
        }

        // --- MIC ---
        document.getElementById('btn-mic').onclick = async () => {
            await init();
            if (!micStream) {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioCtx.createMediaStreamSource(micStream).connect(dest);
                    document.getElementById('btn-mic').classList.replace('bg-gray-700', 'bg-green-600');
                    log("Microphone Aktif");
                } catch(e) { log("Error: Izin Mic ditolak"); }
            } else {
                location.reload(); // Reset sederhana untuk mematikan mic
            }
        };

        // --- MUSIC PLAY / CHANGE ---
        document.getElementById('btn-play').onclick = async () => {
            await init();
            const file = document.getElementById('audio-file').files[0];
            if (!file) return log("Error: Pilih file MP3 dulu");

            if (musicNode) {
                audioTag.pause();
                musicNode.disconnect();
                musicNode = null;
            }

            audioTag.src = URL.createObjectURL(file);
            audioTag.load();

            musicNode = audioCtx.createMediaElementSource(audioTag);
            musicNode.connect(dest);
            musicNode.connect(audioCtx.destination);
            
            audioTag.play();
            log("Memutar: " + file.name);
            document.getElementById('btn-play').classList.replace('bg-blue-600', 'bg-blue-500');
        };

        // --- STOP ---
        document.getElementById('btn-stop').onclick = () => {
            audioTag.pause();
            audioTag.currentTime = 0;
            log("Musik Berhenti");
        };

        document.getElementById('vol').oninput = (e) => { audioTag.volume = e.target.value; };

        // --- RADIO ---
        document.getElementById('btn-radio').onclick = () => {
            if (peer) return;
            peer = new Peer(RADIO_ID);
            
            peer.on('open', (id) => {
                log("Radio ONLINE ID: " + id);
                document.getElementById('btn-radio').innerText = "RADIO ONLINE";
                document.getElementById('btn-radio').classList.replace('bg-green-700', 'bg-green-500');
            });

            peer.on('call', (call) => {
                log("Pendengar masuk...");
                call.answer(dest.stream);
                updateCount(1);
                call.on('close', () => updateCount(-1));
            });

            peer.on('error', (err) => log("PeerJS Error: " + err.type));
        };

        let listenerCount = 0;
        function updateCount(val) {
            listenerCount += val;
            document.getElementById('count').innerText = Math.max(0, listenerCount);
        }
    </script>
</body>
</html>
