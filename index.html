<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Mixer - Ippnuda Radio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .bg-gradient { background: radial-gradient(circle at top, #064e3b, #000000); }
        input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; background: #333; border-radius: 5px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: #22c55e; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body class="bg-gradient min-h-screen text-white flex flex-col items-center p-6">

    <div id="login-box" class="mt-20 w-full max-w-sm glass p-8 rounded-[2rem] text-center border border-white/10">
        <h2 class="text-green-400 font-bold tracking-widest mb-6 uppercase text-sm">Admin Ippnuda login</h2>
        <input type="password" id="pass" placeholder="Password" class="w-full bg-black/40 border border-white/10 p-4 rounded-xl mb-4 text-center focus:outline-none focus:border-green-500">
        <button onclick="login()" class="w-full bg-green-600 py-3 rounded-xl font-bold hover:bg-green-500 transition-all uppercase tracking-widest">Masuk</button>
    </div>

    <main id="main-card" class="hidden w-full max-w-md glass rounded-[2.5rem] p-8 border border-white/10 shadow-2xl mt-10">
        <div class="text-center mb-6">
            <h1 class="text-xl font-light tracking-widest text-green-400 uppercase font-bold">Ippnuda Mixer</h1>
            <p class="text-[10px] opacity-40 mt-1 uppercase tracking-tighter">Pendengar Aktif: <span id="count" class="font-bold text-green-500 text-sm">0</span></p>
        </div>

        <div class="space-y-4">
            <button id="btn-mic" class="w-full py-4 bg-gray-700 rounded-2xl font-bold uppercase text-xs tracking-widest transition-all border border-white/5">Aktifkan Mic</button>
            
            <div class="bg-black/30 p-5 rounded-3xl border border-white/5">
                <label class="text-[9px] text-gray-500 uppercase block mb-3 tracking-widest text-center">Music Control (MP3)</label>
                <input type="file" id="audio-file" accept="audio/*" class="text-[10px] mb-4 block w-full text-gray-400">
                
                <audio id="music-tag" preload="auto"></audio>

                <div class="flex space-x-2 mb-4">
                    <button id="btn-music-play" class="flex-1 py-3 bg-gray-700 rounded-xl text-[10px] font-bold uppercase tracking-widest transition-all">Play / Ganti</button>
                    <button id="btn-music-stop" class="flex-1 py-3 bg-gray-700 rounded-xl text-[10px] font-bold uppercase tracking-widest transition-all">Stop</button>
                </div>

                <div class="flex items-center space-x-3 px-1">
                    <span class="text-[9px] text-gray-500 font-bold uppercase">Vol</span>
                    <input type="range" id="music-volume" min="0" max="1" step="0.1" value="0.5" class="w-full cursor-pointer accent-green-500">
                </div>
            </div>

            <hr class="border-white/5 my-2">
            <button id="start-broadcast" class="w-full py-4 bg-green-700 rounded-2xl font-bold tracking-widest uppercase shadow-lg shadow-green-900/40 hover:bg-green-600 transition-all">Aktifkan Radio</button>
            <button onclick="location.reload()" class="w-full py-2 text-[10px] text-gray-500 uppercase underline mt-4 tracking-tighter">Reset / Logout</button>
        </div>
    </main>

    <script>
        const MY_FIXED_ID = "04021991";
        let peer, audioCtx, dest, micStream, musicNode;
        let isMicOn = false;
        let activeListeners = new Set();

        const musicTag = document.getElementById('music-tag');
        const audioInput = document.getElementById('audio-file');
        const volSlider = document.getElementById('music-volume');

        if(sessionStorage.getItem('auth') === 'true') showApp();

        function login() {
            if(document.getElementById('pass').value === "IPPNUDA") {
                sessionStorage.setItem('auth', 'true');
                showApp();
            } else { alert("Password Salah!"); }
        }

        function showApp() {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('main-card').classList.remove('hidden');
        }

        async function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                dest = audioCtx.createMediaStreamDestination();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
        }

        // --- Logika Mic ---
        document.getElementById('btn-mic').onclick = async () => {
            await initAudio();
            const btn = document.getElementById('btn-mic');
            if (!isMicOn) {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioCtx.createMediaStreamSource(micStream).connect(dest);
                    btn.innerText = "Matikan Mic"; 
                    btn.classList.replace('bg-gray-700', 'bg-green-600');
                    isMicOn = true;
                } catch(e) { alert("Mic tidak diizinkan"); }
            } else {
                micStream.getTracks().forEach(t => t.stop());
                btn.innerText = "Aktifkan Mic"; 
                btn.classList.replace('bg-green-600', 'bg-gray-700');
                isMicOn = false;
            }
        };

        // --- Logika Musik (Perbaikan Ganti File & Play/Stop) ---
        document.getElementById('btn-music-play').onclick = async () => {
            await initAudio();
            const btnPlay = document.getElementById('btn-music-play');
            
            if (audioInput.files[0]) {
                // Putus koneksi lama jika ada ganti file
                if (musicNode) {
                    musicTag.pause();
                    musicNode.disconnect();
                    musicNode = null;
                }

                const fileURL = URL.createObjectURL(audioInput.files[0]);
                musicTag.src = fileURL;
                musicTag.load(); // Paksa muat ulang file baru
                
                musicNode = audioCtx.createMediaElementSource(musicTag);
                musicNode.connect(dest); 
                musicNode.connect(audioCtx.destination);
                
                musicTag.play().then(() => {
                    btnPlay.innerText = "MUSIK BERPUTAR";
                    btnPlay.classList.replace('bg-gray-700', 'bg-blue-600');
                }).catch(e => console.error(e));

            } else { alert("Pilih file MP3!"); }
        };

        document.getElementById('btn-music-stop').onclick = () => {
            if (musicTag) {
                musicTag.pause();
                musicTag.currentTime = 0;
                const btnPlay = document.getElementById('btn-music-play');
                btnPlay.innerText = "Play / Ganti";
                btnPlay.classList.replace('bg-blue-600', 'bg-gray-700');
            }
        };

        volSlider.oninput = (e) => { musicTag.volume = e.target.value; };

        // --- Logika Radio ---
        document.getElementById('start-broadcast').onclick = () => {
            if (peer) return;
            peer = new Peer(MY_FIXED_ID);
            peer.on('open', () => {
                document.getElementById('start-broadcast').innerText = "RADIO ONLINE";
                document.getElementById('start-broadcast').classList.replace('bg-green-700', 'bg-green-500');
            });
            peer.on('call', (call) => {
                call.answer(dest.stream);
                activeListeners.add(call.peer);
                updateDisplay();
                call.on('close', () => { activeListeners.delete(call.peer); updateDisplay(); });
            });
            peer.on('error', (err) => {
                if(err.type === 'unavailable-id') alert("ID Sedang digunakan. Silakan Reset.");
            });
        };

        function updateDisplay() {
            document.getElementById('count').innerText = activeListeners.size;
        }
    </script>
</body>
</html>
