<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penyiar Pro - Ippnuda Radio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); }
        .bg-gradient { background: radial-gradient(circle at top, #064e3b, #000000); }
        .pulse-green { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    </style>
</head>
<body class="bg-gradient min-h-screen text-white flex flex-col items-center justify-center p-4">

    <div id="login-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-6">
        <div class="w-full max-w-sm glass border border-white/10 p-8 rounded-[2.5rem] text-center">
            <h2 class="text-green-400 tracking-[0.3em] uppercase text-sm mb-6">Akses Terbatas</h2>
            <input type="password" id="pass-input" placeholder="Masukkan Password" class="w-full bg-black/40 border border-white/10 rounded-2xl py-4 px-6 mb-4 text-center text-white focus:outline-none focus:border-green-500 font-mono">
            <button onclick="checkPass()" class="w-full py-4 bg-green-600 hover:bg-green-500 rounded-2xl font-bold tracking-widest transition-all">MASUK</button>
        </div>
    </div>

    <main id="app-content" class="w-full max-w-md glass rounded-[3rem] p-8 border border-white/10 shadow-2xl hidden relative overflow-hidden">
        
        <div class="text-center mb-8">
            <h1 class="text-xl font-light tracking-[0.3em] text-green-400 uppercase">Ippnuda Admin</h1>
            <div id="listener-badge" class="inline-block mt-3 px-4 py-1 bg-green-900/30 border border-green-500/20 rounded-full">
                <span class="text-[10px] text-green-300">PENDENGAR: <b id="count">0</b></span>
            </div>
        </div>

        <div id="v-ring" class="w-40 h-40 mx-auto flex items-center justify-center rounded-full border border-green-500/20 mb-8 transition-all duration-700">
            <div class="w-24 h-24 bg-green-500/10 rounded-full flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
            </div>
        </div>

        <div id="controls">
            <div id="setup-view">
                <div class="space-y-4 mb-6">
                    <div class="bg-black/20 p-4 rounded-2xl border border-white/5">
                        <label class="text-[9px] text-gray-500 uppercase block mb-2">Pilih Musik (.mp3)</label>
                        <input type="file" id="audio-file" accept="audio/*" class="text-xs text-gray-400 w-full file:bg-green-700 file:text-white file:border-0 file:rounded-lg file:px-3 file:py-1">
                    </div>
                </div>
                <button id="start-btn" class="w-full py-4 bg-green-600 hover:bg-green-500 rounded-2xl font-bold tracking-widest transition-all shadow-lg shadow-green-900/40">MULAI SIARAN</button>
            </div>

            <div id="on-air-view" class="hidden text-center">
                <div class="flex items-center justify-center space-x-2 mb-6">
                    <span class="w-2 h-2 bg-red-600 rounded-full animate-ping"></span>
                    <span class="text-red-500 font-bold text-xs tracking-widest uppercase">Streaming Live</span>
                </div>
                <div class="bg-black/40 p-4 rounded-2xl border border-green-500/30 mb-6">
                    <p class="text-[10px] opacity-40 uppercase mb-1">ID Stasiun Anda</p>
                    <p class="text-2xl font-mono text-green-400 tracking-widest">04021991</p>
                </div>
                <button onclick="location.reload()" class="text-[10px] text-gray-500 hover:text-red-400 transition-colors uppercase tracking-tighter underline">Hentikan & Reset Halaman</button>
            </div>
        </div>
    </main>

    <script>
        const MY_FIXED_ID = "04021991";
        let peer, audioCtx, dest;
        let connections = [];

        function checkPass() {
            const pass = document.getElementById('pass-input').value;
            if (pass === "IPPNUDA") {
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
            } else {
                alert("Password Salah!");
            }
        }

        document.getElementById('start-btn').onclick = async () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            dest = audioCtx.createMediaStreamDestination();

            try {
                // Audio Sources
                const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx.createMediaStreamSource(micStream).connect(dest);
                
                const audioInput = document.getElementById('audio-file');
                if (audioInput.files[0]) {
                    const audioElem = new Audio(URL.createObjectURL(audioInput.files[0]));
                    const musicSource = audioCtx.createMediaElementSource(audioElem);
                    musicSource.connect(dest);
                    musicSource.connect(audioCtx.destination);
                    audioElem.play();
                }

                // PeerJS Setup
                peer = new Peer(MY_FIXED_ID);
                peer.on('open', () => {
                    document.getElementById('setup-view').classList.add('hidden');
                    document.getElementById('on-air-view').classList.remove('hidden');
                    document.getElementById('v-ring').classList.add('pulse-green', 'border-green-500');
                });

                peer.on('connection', (conn) => {
                    // Monitor jumlah koneksi data jika diperlukan
                });

                peer.on('call', (call) => {
                    call.answer(dest.stream);
                    
                    // Tambah hitungan pendengar saat ada panggilan masuk
                    connections.push(call.peer);
                    updateCount();

                    // Kurangi hitungan jika mereka menutup koneksi
                    call.on('close', () => {
                        connections = connections.filter(id => id !== call.peer);
                        updateCount();
                    });
                });

                peer.on('error', (err) => {
                    if(err.type === 'unavailable-id') alert("ID 04021991 sedang aktif di tab lain.");
                });

            } catch (err) { alert("Mic diperlukan."); }
        };

        function updateCount() {
            // Menggunakan Set agar ID yang sama tidak terhitung dua kali
            const uniqueListeners = [...new Set(connections)];
            document.getElementById('count').innerText = uniqueListeners.length;
        }
    </script>
</body>
</html>
