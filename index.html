<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Ippnuda Radio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); }
        .bg-gradient { background: radial-gradient(circle at top, #064e3b, #000000); }
    </style>
</head>
<body class="bg-gradient min-h-screen text-white flex flex-col items-center justify-center p-4">

    <div id="login-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/95 p-6 hidden">
        <div class="w-full max-w-sm glass border border-white/10 p-8 rounded-[2.5rem] text-center">
            <h2 class="text-green-400 tracking-widest uppercase text-sm mb-6">Ippnuda Security</h2>
            <input type="password" id="pass-input" placeholder="Password" class="w-full bg-black/40 border border-white/10 rounded-2xl py-4 px-6 mb-4 text-center text-white focus:border-green-500 font-mono">
            <button onclick="checkPass()" class="w-full py-4 bg-green-600 rounded-2xl font-bold">MASUK</button>
        </div>
    </div>

    <main id="app-content" class="w-full max-w-md glass rounded-[3rem] p-8 border border-white/10 shadow-2xl">
        <div class="text-center mb-6">
            <div id="status-label" class="inline-block px-3 py-1 bg-gray-800 rounded-full text-[10px] tracking-widest mb-2">SIARAN MATI</div>
            <h1 class="text-xl font-light tracking-[0.3em] text-green-400 uppercase">Ippnuda Mixer</h1>
            <p class="text-[10px] opacity-40 mt-1">PENDENGAR: <span id="count" class="font-bold text-green-500">0</span></p>
        </div>

        <div class="space-y-4">
            <button id="btn-mic" class="w-full py-4 bg-gray-700 rounded-2xl text-xs font-bold transition-all border border-white/5 uppercase tracking-widest">Aktifkan Mic</button>
            
            <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
                <input type="file" id="audio-file" accept="audio/*" class="text-[10px] mb-3 block w-full">
                <button id="btn-music" class="w-full py-3 bg-gray-700 rounded-xl text-xs font-bold uppercase tracking-widest transition-all">Putar Musik</button>
            </div>

            <hr class="border-white/5 my-2">
            
            <button id="start-broadcast" class="w-full py-4 bg-green-700 rounded-2xl font-bold tracking-[0.2em] shadow-lg uppercase">Aktifkan Radio</button>
            <button onclick="location.reload()" class="w-full py-2 text-[10px] text-gray-500 uppercase mt-2">Reset / Logout</button>
        </div>
    </main>

    <script>
        const MY_FIXED_ID = "04021991";
        let peer, audioCtx, dest, micStream, musicTag;
        let isMicOn = false, isMusicOn = false;
        let connections = [];

        if (sessionStorage.getItem('ippnuda_auth') !== 'true') document.getElementById('login-overlay').classList.remove('hidden');

        function checkPass() {
            if (document.getElementById('pass-input').value === "IPPNUDA") {
                sessionStorage.setItem('ippnuda_auth', 'true');
                document.getElementById('login-overlay').classList.add('hidden');
            }
        }

        async function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                dest = audioCtx.createMediaStreamDestination();
            }
        }

        // Toggle Mic
        document.getElementById('btn-mic').onclick = async () => {
            await initAudio();
            const btn = document.getElementById('btn-mic');
            if (!isMicOn) {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                micSource = audioCtx.createMediaStreamSource(micStream);
                micSource.connect(dest);
                btn.innerText = "Matikan Mic";
                btn.classList.replace('bg-gray-700', 'bg-green-600');
                isMicOn = true;
            } else {
                micStream.getTracks().forEach(t => t.stop());
                btn.innerText = "Aktifkan Mic";
                btn.classList.replace('bg-green-600', 'bg-gray-700');
                isMicOn = false;
                micStream = null;
            }
        };

        // Toggle Music
        document.getElementById('btn-music').onclick = async () => {
            await initAudio();
            const btn = document.getElementById('btn-music');
            if (!isMusicOn) {
                const file = document.getElementById('audio-file').files[0];
                if (!file) return alert("Pilih file!");
                musicTag = new Audio(URL.createObjectURL(file));
                const source = audioCtx.createMediaElementSource(musicTag);
                source.connect(dest);
                source.connect(audioCtx.destination);
                musicTag.play();
                btn.innerText = "Berhenti Musik";
                btn.classList.replace('bg-gray-700', 'bg-blue-600');
                isMusicOn = true;
            } else {
                musicTag.pause();
                btn.innerText = "Putar Musik";
                btn.classList.replace('bg-blue-600', 'bg-gray-700');
                isMusicOn = false;
            }
        };

        document.getElementById('start-broadcast').onclick = () => {
            if (peer) return;
            peer = new Peer(MY_FIXED_ID);
            peer.on('open', () => {
                document.getElementById('status-label').innerText = "SIARAN AKTIF";
                document.getElementById('status-label').classList.replace('bg-gray-800', 'bg-red-600');
                document.getElementById('start-broadcast').innerText = "RADIO ONLINE";
                document.getElementById('start-broadcast').classList.replace('bg-green-700', 'bg-green-500');
            });
            peer.on('call', (call) => {
                call.answer(dest.stream);
                connections.push(call.peer);
                updateCount();
                call.on('close', () => { 
                    connections = connections.filter(id => id !== call.peer); 
                    updateCount(); 
                });
            });
        };

        function updateCount() {
            document.getElementById('count').innerText = [...new Set(connections)].length;
        }
    </script>
</body>
</html>
