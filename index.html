<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dengar Ippnuda Radio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); }
        .bg-gradient { background: radial-gradient(circle at center, #065f46, #000000); }
        .wave { animation: wave 1.2s infinite ease-in-out; }
        @keyframes wave { 0%, 100% { height: 10px; } 50% { height: 40px; } }
    </style>
</head>
<body class="bg-gradient min-h-screen text-white flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-sm glass border border-white/10 rounded-[3rem] p-10 text-center shadow-2xl">
        <h1 class="text-xs tracking-[0.4em] text-green-400 opacity-70 uppercase mb-10">Ippnuda Digital Receiver</h1>
        
        <div id="loader" class="flex items-center justify-center space-x-1 h-12 mb-10 opacity-20">
            <div class="w-1 bg-green-500 wave" style="animation-delay: 0.1s"></div>
            <div class="w-1 bg-green-500 wave" style="animation-delay: 0.2s"></div>
            <div class="w-1 bg-green-500 wave" style="animation-delay: 0.3s"></div>
        </div>

        <button id="main-btn" class="w-24 h-24 bg-green-600 rounded-full flex items-center justify-center mx-auto shadow-[0_0_50px_rgba(34,197,94,0.4)] hover:scale-105 active:scale-90 transition-all">
            <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            </svg>
        </button>

        <div class="mt-10">
            <p id="status-text" class="text-sm font-medium tracking-widest text-gray-400 uppercase">Siap Mendengar</p>
            <p id="sub-text" class="text-[10px] opacity-40 mt-2 italic">Klik tombol untuk mulai</p>
        </div>

        <div id="booster-ui" class="mt-8 pt-8 border-t border-white/5 hidden">
            <label class="text-[9px] text-green-500 uppercase tracking-widest block mb-2">Volume Booster</label>
            <input type="range" id="volume-boost" min="1" max="5" step="0.5" value="1" class="w-full accent-green-500">
        </div>
    </div>

    <script>
        const HOST_ID = "04021991";
        const peer = new Peer();
        const mainBtn = document.getElementById('main-btn');
        const statusText = document.getElementById('status-text');
        const subText = document.getElementById('sub-text');
        const loader = document.getElementById('loader');
        const boosterUi = document.getElementById('booster-ui');
        
        let isActivated = false;
        let audioCtx, gainNode;

        async function connectToRadio() {
            if (!isActivated) return;

            statusText.innerText = "Mencari Siaran...";
            loader.classList.replace('opacity-20', 'opacity-100');

            // Kita butuh audio stream kosong untuk inisialisasi Web Audio
            try {
                const dummyStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const call = peer.call(HOST_ID, dummyStream);

                call.on('stream', (remoteStream) => {
                    statusText.innerText = "• ON AIR •";
                    statusText.classList.add('text-green-500');
                    subText.innerText = "Terhubung secara real-time";
                    boosterUi.classList.remove('hidden');

                    // Setup Audio dengan Booster (GainNode)
                    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioCtx.createMediaStreamSource(remoteStream);
                    gainNode = audioCtx.createGain();
                    
                    source.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    // Hubungkan slider ke booster
                    document.getElementById('volume-boost').oninput = (e) => {
                        gainNode.gain.value = e.target.value;
                    };
                });

                call.on('error', attemptReconnect);
                // Jika dalam 10 detik tidak ada stream, coba lagi
                setTimeout(() => { if(statusText.innerText === "Mencari Siaran...") attemptReconnect(); }, 10000);

            } catch (err) {
                alert("Izin mic diperlukan agar sistem sinkron.");
            }
        }

        function attemptReconnect() {
            if (!isActivated) return;
            statusText.innerText = "Offline - Menunggu...";
            statusText.classList.remove('text-green-500');
            setTimeout(connectToRadio, 5000); // Retry setiap 5 detik
        }

        mainBtn.onclick = () => {
            if (isActivated) return;
            isActivated = true;
            mainBtn.classList.add('opacity-50', 'pointer-events-none');
            connectToRadio();
        };
    </script>
</body>
</html>
