<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ippnuda Announcer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .bg-gradient { background: radial-gradient(circle at top, #064e3b, #000000); }
    </style>
</head>
<body class="bg-gradient min-h-screen text-white flex flex-col items-center justify-center p-6">

    <div id="login-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/95 p-6 hidden">
        <div class="w-full max-w-sm glass border border-white/10 p-8 rounded-[2.5rem] text-center shadow-2xl">
            <h2 class="text-green-400 font-bold tracking-[0.3em] uppercase text-sm mb-6">Security Access</h2>
            <input type="password" id="pass-input" placeholder="Masukkan Password" class="w-full bg-black/40 border border-white/10 rounded-2xl py-4 px-6 mb-4 text-center text-white focus:outline-none focus:border-green-500 font-mono">
            <button onclick="checkPass()" class="w-full py-4 bg-green-600 hover:bg-green-500 rounded-2xl font-bold tracking-widest transition-all">VERIFIKASI</button>
        </div>
    </div>

    <main id="app-content" class="w-full max-w-md glass rounded-[2.5rem] p-8 border border-white/10 shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold tracking-widest text-green-400 uppercase">Ippnuda Announcer</h1>
            <p class="text-[10px] opacity-40 uppercase tracking-widest">Pendengar: <span id="count">0</span></p>
        </div>

        <div class="space-y-4">
            <div class="bg-black/30 p-4 rounded-2xl border border-white/5">
                <input type="file" id="audio-file" accept="audio/*" class="text-[10px] mb-4 w-full">
                <div class="flex space-x-2">
                    <button id="btn-play" class="flex-1 py-3 bg-blue-600 rounded-xl text-[10px] font-bold uppercase active:scale-95">Play / Ganti</button>
                    <button id="btn-stop" class="flex-1 py-3 bg-gray-700 rounded-xl text-[10px] font-bold uppercase">Stop</button>
                </div>
                <div class="flex items-center space-x-2 mt-4">
                    <span class="text-[9px] opacity-40 uppercase">Vol</span>
                    <input type="range" id="vol" min="0" max="1" step="0.1" value="0.5" class="w-full accent-green-500">
                </div>
            </div>

            <button id="btn-mic" class="w-full py-4 bg-gray-700 rounded-2xl font-bold uppercase text-xs active:scale-95">Aktifkan Mic</button>
            <button id="btn-radio" class="w-full py-4 bg-green-700 rounded-2xl font-bold uppercase text-xs">Aktifkan Radio</button>
            
            <div id="debug" class="text-[10px] text-yellow-500 font-mono p-3 bg-black/60 rounded-xl h-20 overflow-y-auto border border-white/5 mt-4">
                [Status] Siap...
            </div>

            <button onclick="logout()" class="w-full py-2 text-[10px] opacity-30 uppercase underline mt-2">Logout & Reset</button>
        </div>
    </main>

    <script>
        const RADIO_ID = "04021991";
        let peer, audioCtx, dest, micStream, musicNode, currentAudio;
        const debug = document.getElementById('debug');

        // --- SECURITY LOGIC ---
        if (sessionStorage.getItem('ippnuda_auth') !== 'true') {
            document.getElementById('login-overlay').classList.remove('hidden');
        }

        function checkPass() {
            const pass = document.getElementById('pass-input').value;
            if (pass === "IPPNUDA") {
                sessionStorage.setItem('ippnuda_auth', 'true');
                document.getElementById('login-overlay').classList.add('hidden');
                log("Login Berhasil.");
            } else {
                alert("Password Salah!");
            }
        }

        function logout() {
            sessionStorage.removeItem('ippnuda_auth');
            location.reload();
        }

        // --- AUDIO ENGINE LOGIC ---
        function log(msg) {
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            debug.innerHTML = `[${time}] ${msg}<br>` + debug.innerHTML;
        }

        async function initAudioEngine() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                dest = audioCtx.createMediaStreamDestination();
                log("Mixer Utama Aktif");
            }
            if (audioCtx.state === 'suspended') await audioCtx.resume();
        }

        // --- MICROPHONE ---
        document.getElementById('btn-mic').onclick = async () => {
            await initAudioEngine();
            if (!micStream) {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const micSource = audioCtx.createMediaStreamSource(micStream);
                    micSource.connect(dest);
                    document.getElementById('btn-mic').classList.replace('bg-gray-700', 'bg-green-600');
                    log("Mic ON (Terhubung ke Siaran)");
                } catch(e) { log("Error Mic: " + e.message); }
            } else {
                log("Sistem Mic aktif.");
            }
        };

        // --- MUSIC PLAY / CHANGE ---
        document.getElementById('btn-play').onclick = async () => {
            await initAudioEngine();
            const file = document.getElementById('audio-file').files[0];
            if (!file) return log("Pilih file MP3!");

            try {
                if (currentAudio) {
                    currentAudio.pause();
                    if (musicNode) musicNode.disconnect();
                }

                currentAudio = new Audio();
                currentAudio.src = URL.createObjectURL(file);
                currentAudio.crossOrigin = "anonymous";
                currentAudio.volume = document.getElementById('vol').value;

                musicNode = audioCtx.createMediaElementSource(currentAudio);
                musicNode.connect(dest); 
                musicNode.connect(audioCtx.destination);
                
                await currentAudio.play();
                log("MP3 ON: " + file.name);
                document.getElementById('btn-play').innerText = "GANTI LAGU";
            } catch (err) { log("Error Play: " + err.message); }
        };

        document.getElementById('btn-stop').onclick = () => {
            if (currentAudio) {
                currentAudio.pause();
                log("Musik Berhenti.");
            }
        };

        document.getElementById('vol').oninput = (e) => {
            if (currentAudio) currentAudio.volume = e.target.value;
        };

        // --- RADIO BROADCAST ---
        document.getElementById('btn-radio').onclick = () => {
            if (peer) return;
            peer = new Peer(RADIO_ID);
            
            peer.on('open', (id) => {
                log("RADIO ONLINE ID: " + id);
                document.getElementById('btn-radio').innerText = "RADIO ONLINE";
                document.getElementById('btn-radio').classList.replace('bg-green-700', 'bg-green-500');
            });

            peer.on('call', (call) => {
                log("Pendengar baru masuk!");
                call.answer(dest.stream);
                updateCount(1);
                call.on('close', () => updateCount(-1));
            });

            peer.on('error', (err) => log("Peer Error: " + err.type));
        };

        let listenerCount = 0;
        function updateCount(val) {
            listenerCount += val;
            document.getElementById('count').innerText = Math.max(0, listenerCount);
        }
    </script>
</body>
</html>
