<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ippnuda Mini Radio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .bg-gradient { background: radial-gradient(circle at top, #064e3b, #000000); }
        .pulse-green { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    </style>
</head>
<body class="bg-gradient min-h-screen text-white font-sans flex flex-col items-center p-6">

    <header class="text-center mt-10 mb-8">
        <h1 class="text-2xl font-light tracking-[0.2em] text-green-400 uppercase">Ippnuda Radio</h1>
        <p class="text-xs opacity-50">Modern & Elegant Broadcasting</p>
    </header>

    <div id="visualizer-container" class="relative w-64 h-64 flex items-center justify-center rounded-full border border-green-800/30 mb-10">
        <div id="status-ring" class="absolute inset-0 rounded-full border-2 border-green-500/20"></div>
        <div class="w-40 h-40 bg-green-600/10 rounded-full flex items-center justify-center pulse-green">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
            </svg>
        </div>
    </div>

    <main class="w-full max-w-md glass rounded-[2rem] p-8 border border-white/5 shadow-2xl">
        <div id="setup-section">
            <h2 class="text-lg text-center mb-6 font-medium">Mulai Siaran Mini</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-green-400 block mb-2 px-1">Pilih Musik (MP3)</label>
                    <input type="file" id="audio-file" accept="audio/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:bg-green-600 file:text-white hover:file:bg-green-700 cursor-pointer">
                </div>
                
                <button id="start-btn" class="w-full py-4 bg-green-600 hover:bg-green-500 rounded-2xl font-bold transition-all shadow-lg shadow-green-900/20 mt-4">
                    AKTIFKAN RADIO
                </button>
            </div>
        </div>

        <div id="live-section" class="hidden text-center">
            <div class="flex items-center justify-center space-x-2 mb-4">
                <span class="flex h-3 w-3 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-red-600"></span>
                </span>
                <span class="text-red-500 font-bold text-sm tracking-widest">ON AIR</span>
            </div>
            <p class="text-sm opacity-70 mb-4">ID Radio Anda:</p>
            <div class="bg-black/40 p-3 rounded-xl border border-white/10 select-all font-mono text-green-400" id="peer-id-display">Generating...</div>
            <p class="text-[10px] mt-4 opacity-40">Berikan ID ini kepada pendengar</p>
        </div>
    </main>

    <script>
        const startBtn = document.getElementById('start-btn');
        const audioInput = document.getElementById('audio-file');
        const setupSection = document.getElementById('setup-section');
        const liveSection = document.getElementById('live-section');
        const peerIdDisplay = document.getElementById('peer-id-display');

        let peer;
        let audioCtx;
        let dest;

        startBtn.onclick = async () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            dest = audioCtx.createMediaStreamDestination();

            try {
                // 1. Ambil Mic
                const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const micSource = audioCtx.createMediaStreamSource(micStream);
                
                // 2. Setup Musik jika ada
                if (audioInput.files[0]) {
                    const audioElem = new Audio(URL.createObjectURL(audioInput.files[0]));
                    const musicSource = audioCtx.createMediaElementSource(audioElem);
                    musicSource.connect(dest);
                    musicSource.connect(audioCtx.destination); // Kita juga dengar
                    audioElem.play();
                }

                micSource.connect(dest);

                // 3. Inisialisasi PeerJS
                peer = new Peer();
                peer.on('open', (id) => {
                    peerIdDisplay.innerText = id;
                    setupSection.classList.add('hidden');
                    liveSection.classList.remove('hidden');
                });

                // Menangani pendengar yang masuk
                peer.on('call', (call) => {
                    call.answer(dest.stream); // Kirim suara campuran
                });

            } catch (err) {
                alert("Mohon izinkan akses microphone");
                console.error(err);
            }
        };
    </script>
</body>
</html>
