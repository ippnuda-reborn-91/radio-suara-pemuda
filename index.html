<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ippnuda Announcer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .bg-gradient { background: radial-gradient(circle at top, #064e3b, #000000); }
        .load-bar { transition: width 0.5s ease-in-out, background-color 0.5s ease; }
        
        /* Animasi Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #22c55e;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gradient min-h-screen text-white flex flex-col items-center justify-center p-6">

    <div id="login-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/95 p-6 hidden">
        <div class="w-full max-w-sm glass border border-white/10 p-8 rounded-[2.5rem] text-center shadow-2xl">
            <h2 class="text-green-400 font-bold tracking-[0.3em] uppercase text-sm mb-6">Security Access</h2>
            <input type="password" id="pass-input" placeholder="Password" class="w-full bg-black/40 border border-white/10 rounded-2xl py-4 px-6 mb-4 text-center text-white focus:outline-none focus:border-green-500 font-mono">
            <button onclick="checkPass()" class="w-full py-4 bg-green-600 hover:bg-green-500 rounded-2xl font-bold tracking-widest uppercase">Verifikasi</button>
        </div>
    </div>

    <main id="app-content" class="w-full max-w-md glass rounded-[2.5rem] p-8 border border-white/10 shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold tracking-widest text-green-400 uppercase">Ippnuda Announcer</h1>
            
            <div class="mt-4 px-4">
                <div class="flex justify-between text-[9px] uppercase tracking-widest mb-1 opacity-60">
                    <span>Beban Perangkat</span>
                    <span><span id="count">0</span> / 25 User</span>
                </div>
                <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden">
                    <div id="load-indicator" class="load-bar h-full bg-green-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="space-y-4">
            <div class="bg-black/30 p-4 rounded-2xl border border-white/5">
                <input type="file" id="audio-file" accept="audio/*" class="text-[10px] mb-4 w-full">
                <div class="flex space-x-2">
                    <button id="btn-play" class="flex-1 py-3 bg-blue-600 rounded-xl text-[10px] font-bold uppercase active:scale-95">Play / Ganti</button>
                    <button id="btn-stop" class="flex-1 py-3 bg-gray-700 rounded-xl text-[10px] font-bold uppercase">Stop</button>
                </div>
                <div class="flex items-center space-x-2 mt-4">
                    <span class="text-[9px] opacity-40 uppercase">Vol</span>
                    <input type="range" id="vol" min="0" max="1" step="0.1" value="0.5" class="w-full accent-green-500">
                </div>
            </div>

            <button id="btn-mic" class="w-full py-4 bg-gray-700 rounded-2xl font-bold uppercase text-xs active:scale-95">Aktifkan Mic</button>
            
            <button id="btn-radio" class="w-full py-4 bg-green-700 rounded-2xl font-bold uppercase text-xs transition-all flex items-center justify-center">
                <span id="radio-loader" class="spinner hidden"></span>
                <span id="radio-text">Aktifkan Radio</span>
            </button>
            
            <div id="debug" class="text-[10px] text-yellow-500 font-mono p-3 bg-black/60 rounded-xl h-40 overflow-y-auto border border-white/5 mt-4 leading-relaxed">
                [Status] Siap...
            </div>

            <button onclick="logout()" class="w-full py-2 text-[10px] opacity-30 uppercase underline mt-2">Logout & Reset</button>
        </div>
    </main>

    <script>
        const RADIO_ID = "04021991";
        const MAX_RECOMMENDED = 25;
        let peer, audioCtx, dest, micStream, musicNode, currentAudio;
        let activeConnections = new Set();
        const debug = document.getElementById('debug');

        // --- SECURITY ---
        if (sessionStorage.getItem('ippnuda_auth') !== 'true') {
            document.getElementById('login-overlay').classList.remove('hidden');
        }
        function checkPass() {
            if (document.getElementById('pass-input').value === "IPPNUDA") {
                sessionStorage.setItem('ippnuda_auth', 'true');
                document.getElementById('login-overlay').classList.add('hidden');
            } else { alert("Salah!"); }
        }
        function logout() { sessionStorage.removeItem('ippnuda_auth'); location.reload(); }

        // --- AUDIO ENGINE ---
        function log(msg) {
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            debug.innerHTML = `[${time}] ${msg}<br>` + debug.innerHTML;
        }

        async function initAudioEngine() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                dest = audioCtx.createMediaStreamDestination();
                log("Mixer Aktif");
            }
            if (audioCtx.state === 'suspended') await audioCtx.resume();
        }

        // --- CONTROLS ---
        document.getElementById('btn-mic').onclick = async () => {
            await initAudioEngine();
            if (!micStream) {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioCtx.createMediaStreamSource(micStream).connect(dest);
                    document.getElementById('btn-mic').classList.replace('bg-gray-700', 'bg-green-600');
                    log("Mic ON");
                } catch(e) { log("Error Mic: " + e.message); }
            }
        };

        document.getElementById('btn-play').onclick = async () => {
            await initAudioEngine();
            const file = document.getElementById('audio-file').files[0];
            if (!file) return;
            if (currentAudio) { currentAudio.pause(); if (musicNode) musicNode.disconnect(); }
            currentAudio = new Audio(URL.createObjectURL(file));
            musicNode = audioCtx.createMediaElementSource(currentAudio);
            musicNode.connect(dest); musicNode.connect(audioCtx.destination);
            currentAudio.play();
            log("MP3 Play: " + file.name);
        };

        document.getElementById('btn-radio').onclick = () => {
            if (peer) return;

            // Tampilkan Loading
            const loader = document.getElementById('radio-loader');
            const btnText = document.getElementById('radio-text');
            const btnRadio = document.getElementById('btn-radio');
            
            loader.classList.remove('hidden');
            btnText.innerText = "Menghubungkan...";
            log("Menghubungkan ke Peer Server...");

            peer = new Peer(RADIO_ID);

            peer.on('open', (id) => {
                loader.classList.add('hidden');
                btnText.innerText = "RADIO ONLINE";
                btnRadio.classList.replace('bg-green-700', 'bg-green-500');
                log("RADIO ONLINE: ID " + id);
            });

            peer.on('call', (call) => {
                call.answer(dest.stream);
                activeConnections.add(call.peer);
                updateLoadMonitor();
                call.on('close', () => { activeConnections.delete(call.peer); updateLoadMonitor(); });
            });

            peer.on('error', (err) => {
                loader.classList.add('hidden');
                btnText.innerText = "Aktifkan Radio";
                log("Peer Error: " + err.type);
                peer = null;
            });
        };

        function updateLoadMonitor() {
            const count = activeConnections.size;
            const bar = document.getElementById('load-indicator');
            document.getElementById('count').innerText = count;
            let percent = (count / MAX_RECOMMENDED) * 100;
            bar.style.width = Math.min(percent, 100) + "%";
            if (count <= 10) bar.className = "load-bar h-full bg-green-500";
            else if (count <= 20) bar.className = "load-bar h-full bg-yellow-500";
            else bar.className = "load-bar h-full bg-red-500 animate-pulse";
            log(`Pendengar baru terhubung. Total: ${count}`);
        }
    </script>
</body>
</html>
