<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Ippnuda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen font-sans">

    <main class="w-full max-w-md p-8 bg-zinc-900 rounded-[2.5rem] border border-white/10 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-green-500 tracking-[0.3em] font-bold uppercase text-lg">Ippnuda Admin</h1>
            <p id="status" class="text-[10px] opacity-50 mt-2 uppercase tracking-widest">Status: Offline</p>
        </div>

        <div class="space-y-6">
            <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
                <label class="text-[10px] opacity-40 uppercase block mb-2">Pilih Lagu (.mp3)</label>
                <input type="file" id="music-file" accept="audio/*" class="text-xs w-full">
            </div>

            <button id="master-btn" class="w-full py-5 bg-green-600 rounded-2xl font-bold tracking-widest shadow-lg active:scale-95 transition-all">
                AKTIFKAN RADIO & MIC
            </button>

            <div class="flex justify-between items-center px-2">
                <span class="text-[10px] opacity-40 uppercase">Pendengar Aktif</span>
                <span id="count" class="text-green-500 font-bold">0</span>
            </div>

            <button onclick="location.reload()" class="w-full py-2 text-[10px] opacity-30 hover:opacity-100 uppercase underline">Reset Koneksi</button>
        </div>
    </main>

    <script>
        const RADIO_ID = "04021991";
        let peer, audioCtx, dest, stream;
        let connections = new Set();

        document.getElementById('master-btn').onclick = async function() {
            try {
                // 1. Inisialisasi Audio
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                dest = audioCtx.createMediaStreamDestination();

                // 2. Ambil Mic
                const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx.createMediaStreamSource(micStream).connect(dest);

                // 3. Tambah Musik jika ada
                const file = document.getElementById('music-file').files[0];
                if (file) {
                    const audio = new Audio(URL.createObjectURL(file));
                    const source = audioCtx.createMediaElementSource(audio);
                    source.connect(dest);
                    source.connect(audioCtx.destination);
                    audio.play();
                }

                // 4. Aktifkan PeerJS
                peer = new Peer(RADIO_ID);
                peer.on('open', (id) => {
                    document.getElementById('status').innerText = "Status: Online (Broadcasting)";
                    document.getElementById('master-btn').innerText = "SIARAN AKTIF";
                    document.getElementById('master-btn').classList.replace('bg-green-600', 'bg-red-600');
                    document.getElementById('master-btn').disabled = true;
                });

                peer.on('call', (call) => {
                    call.answer(dest.stream);
                    connections.add(call.peer);
                    document.getElementById('count').innerText = connections.size;
                    call.on('close', () => { connections.delete(call.peer); document.getElementById('count').innerText = connections.size; });
                });

                peer.on('error', (err) => {
                    if(err.type === 'unavailable-id') alert("ID Masih dipakai. Tunggu 5 detik lalu klik Reset.");
                });

            } catch (err) {
                alert("Harap izinkan Microphone!");
            }
        };
    </script>
</body>
</html>
