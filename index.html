<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Ippnuda Radio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); }
        .bg-gradient { background: radial-gradient(circle at top, #064e3b, #000000); }
        .pulse-red { animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); } }
    </style>
</head>
<body class="bg-gradient min-h-screen text-white flex flex-col items-center justify-center p-4">

    <div id="login-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/95 p-6 hidden">
        <div class="w-full max-w-sm glass border border-white/10 p-8 rounded-[2.5rem] text-center">
            <h2 class="text-green-400 tracking-[0.3em] uppercase text-sm mb-6 font-bold">Ippnuda Security</h2>
            <input type="password" id="pass-input" placeholder="Password" class="w-full bg-black/40 border border-white/10 rounded-2xl py-4 px-6 mb-4 text-center text-white focus:border-green-500 font-mono">
            <button onclick="checkPass()" class="w-full py-4 bg-green-600 rounded-2xl font-bold tracking-widest">VERIFIKASI</button>
        </div>
    </div>

    <main id="app-content" class="w-full max-w-md glass rounded-[3rem] p-8 border border-white/10 shadow-2xl relative">
        <div class="text-center mb-6">
            <div id="status-label" class="inline-block px-3 py-1 bg-gray-800 rounded-full text-[10px] tracking-widest mb-2">RADIO OFFLINE</div>
            <h1 class="text-xl font-light tracking-[0.3em] text-green-400 uppercase">Ippnuda Mixer</h1>
            <p class="text-[10px] opacity-40 mt-1">PENDENGAR: <span id="count" class="font-bold text-green-500">0</span></p>
        </div>

        <div class="space-y-4">
            <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold uppercase tracking-tighter">Microphone</span>
                    <span id="mic-status" class="text-[9px] text-gray-500">OFF</span>
                </div>
                <button id="btn-mic" class="w-full py-3 bg-gray-700 rounded-xl text-xs font-bold transition-all">AKTIFKAN MIC</button>
            </div>

            <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
                <label class="text-[9px] text-gray-500 uppercase block mb-2">Music Player (.mp3)</label>
                <input type="file" id="audio-file" accept="audio/*" class="text-[10px] mb-3 block w-full">
                <button id="btn-music" class="w-full py-3 bg-gray-700 rounded-xl text-xs font-bold transition-all">PUTAR MUSIK</button>
            </div>

            <hr class="border-white/5 my-4">

            <button id="start-broadcast" class="w-full py-4 bg-green-600 rounded-2xl font-bold tracking-widest shadow-lg shadow-green-900/40">MULAI SIARAN</button>
            <button onclick="location.reload()" class="w-full py-2 text-[10px] text-gray-500 hover:text-red-400 uppercase tracking-widest mt-2">Reset Sistem</button>
        </div>
    </main>

    <script>
        const MY_FIXED_ID = "04021991";
        let peer, audioCtx, dest, micStream, musicSource;
        let connections = [];

        // Auto-Login check
        if (sessionStorage.getItem('ippnuda_auth') !== 'true') {
            document.getElementById('login-overlay').classList.remove('hidden');
        }

        function checkPass() {
            if (document.getElementById('pass-input').value === "IPPNUDA") {
                sessionStorage.setItem('ippnuda_auth', 'true');
                document.getElementById('login-overlay').classList.add('hidden');
            } else { alert("Salah!"); }
        }

        async function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                dest = audioCtx.createMediaStreamDestination();
            }
        }

        document.getElementById('btn-mic').onclick = async () => {
            await initAudio();
            if (!micStream) {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx.createMediaStreamSource(micStream).connect(dest);
                document.getElementById('btn-mic').classList.replace('bg-gray-700', 'bg-green-600');
                document.getElementById('mic-status').innerText = "LIVE";
            }
        };

        document.getElementById('btn-music').onclick = async () => {
            await initAudio();
            const file = document.getElementById('audio-file').files[0];
            if (file) {
                const audio = new Audio(URL.createObjectURL(file));
                const source = audioCtx.createMediaElementSource(audio);
                source.connect(dest);
                source.connect(audioCtx.destination);
                audio.play();
                document.getElementById('btn-music').classList.replace('bg-gray-700', 'bg-blue-600');
                document.getElementById('btn-music').innerText = "MUSIK BERPUTAR";
            } else { alert("Pilih file dulu!"); }
        };

        document.getElementById('start-broadcast').onclick = () => {
            if (!audioCtx) return alert("Nyalakan Mic atau Musik dulu!");
            
            peer = new Peer(MY_FIXED_ID);
            peer.on('open', () => {
                document.getElementById('status-label').innerText = "ON AIR";
                document.getElementById('status-label').classList.replace('bg-gray-800', 'bg-red-600');
                document.getElementById('status-label').classList.add('pulse-red');
                document.getElementById('start-broadcast').innerText = "SIARAN AKTIF";
                document.getElementById('start-broadcast').disabled = true;
            });

            peer.on('call', (call) => {
                call.answer(dest.stream);
                connections.push(call.peer);
                updateCount();
                call.on('close', () => { connections = connections.filter(id => id !== call.peer); updateCount(); });
            });
        };

        function updateCount() {
            document.getElementById('count').innerText = [...new Set(connections)].length;
        }
    </script>
</body>
</html>
