<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penyiar - Ippnuda Radio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .bg-gradient { background: radial-gradient(circle at top, #064e3b, #000000); }
        .pulse-green { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    </style>
</head>
<body class="bg-gradient min-h-screen text-white flex flex-col items-center p-6">
    <header class="text-center mt-10 mb-8">
        <h1 class="text-2xl font-light tracking-[0.2em] text-green-400 uppercase">Ippnuda Broadcast</h1>
        <p class="text-[10px] opacity-50">ID TETAP: 04021991</p>
    </header>

    <div class="w-64 h-64 flex items-center justify-center rounded-full border border-green-800/30 mb-10 pulse-green">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
        </svg>
    </div>

    <main class="w-full max-w-md glass rounded-[2rem] p-8 border border-white/5 shadow-2xl">
        <div id="setup-section">
            <div class="space-y-4">
                <input type="file" id="audio-file" accept="audio/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-green-600 file:text-white">
                <button id="start-btn" class="w-full py-4 bg-green-600 hover:bg-green-500 rounded-2xl font-bold transition-all">AKTIFKAN SIARAN</button>
            </div>
        </div>

        <div id="live-section" class="hidden text-center">
            <div class="flex items-center justify-center space-x-2 mb-4">
                <span class="w-3 h-3 bg-red-600 rounded-full animate-ping"></span>
                <span class="text-red-500 font-bold text-sm tracking-widest">ON AIR</span>
            </div>
            <p class="text-xs opacity-60 mb-2">ID Radio Anda Aktif:</p>
            <div class="bg-black/40 p-3 rounded-xl border border-green-500/30 text-green-400 font-mono text-xl">04021991</div>
        </div>
    </main>

    <script>
        const MY_FIXED_ID = "04021991";
        const startBtn = document.getElementById('start-btn');
        const audioInput = document.getElementById('audio-file');
        let peer, audioCtx, dest;

        startBtn.onclick = async () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            dest = audioCtx.createMediaStreamDestination();

            try {
                const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx.createMediaStreamSource(micStream).connect(dest);
                
                if (audioInput.files[0]) {
                    const audioElem = new Audio(URL.createObjectURL(audioInput.files[0]));
                    const musicSource = audioCtx.createMediaElementSource(audioElem);
                    musicSource.connect(dest);
                    musicSource.connect(audioCtx.destination);
                    audioElem.play();
                }

                peer = new Peer(MY_FIXED_ID);
                peer.on('open', () => {
                    document.getElementById('setup-section').classList.add('hidden');
                    document.getElementById('live-section').classList.remove('hidden');
                });
                peer.on('call', (call) => call.answer(dest.stream));
                peer.on('error', (err) => {
                    if(err.type === 'unavailable-id') alert("ID sedang digunakan atau Anda belum menutup tab siaran sebelumnya.");
                });
            } catch (err) { alert("Mic diperlukan."); }
        };
    </script>
</body>
</html>
