<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Ippnuda Radio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .bg-gradient { background: radial-gradient(circle at top, #064e3b, #000000); }
    </style>
</head>
<body class="bg-gradient min-h-screen text-white flex flex-col items-center p-6">

    <div id="login-box" class="mt-20 w-full max-w-sm glass p-8 rounded-[2rem] text-center border border-white/10">
        <h2 class="text-green-400 font-bold tracking-widest mb-6">LOGIN ADMIN</h2>
        <input type="password" id="pass" placeholder="Password" class="w-full bg-black/40 border border-white/10 p-4 rounded-xl mb-4 text-center">
        <button onclick="login()" class="w-full bg-green-600 py-3 rounded-xl font-bold">MASUK</button>
    </div>

    <main id="main-card" class="hidden w-full max-w-md glass rounded-[2.5rem] p-8 border border-white/10 shadow-2xl mt-10">
        <div class="text-center mb-6">
            <h1 class="text-xl font-light tracking-widest text-green-400 uppercase">Ippnuda Admin</h1>
            <p class="text-[10px] opacity-50 mt-1">PENDENGAR: <span id="count" class="font-bold text-green-500">0</span></p>
        </div>

        <div class="space-y-4">
            <button id="btn-mic" class="w-full py-4 bg-gray-700 rounded-2xl font-bold uppercase text-xs tracking-widest transition-all">Aktifkan Mic</button>
            
            <div class="bg-black/20 p-4 rounded-2xl border border-white/5">
                <input type="file" id="audio-file" accept="audio/*" class="text-[10px] mb-3 block w-full">
                <button id="btn-music" class="w-full py-3 bg-gray-700 rounded-xl font-bold uppercase text-xs tracking-widest">Putar Musik</button>
            </div>

            <hr class="border-white/5">
            <button id="start-broadcast" class="w-full py-4 bg-green-700 rounded-2xl font-bold tracking-widest uppercase shadow-lg shadow-green-900/40">Aktifkan Radio</button>
            <button onclick="location.reload()" class="w-full py-2 text-[10px] text-gray-500 uppercase underline mt-2">Reset / Logout</button>
        </div>
    </main>

    <script>
        const MY_FIXED_ID = "04021991";
        let peer, audioCtx, dest, micStream, musicTag;
        let isMicOn = false, isMusicOn = false;
        let activeListeners = new Set();

        if(sessionStorage.getItem('auth') === 'true') showApp();

        function login() {
            if(document.getElementById('pass').value === "IPPNUDA") {
                sessionStorage.setItem('auth', 'true');
                showApp();
            } else { alert("Salah!"); }
        }

        function showApp() {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('main-card').classList.remove('hidden');
        }

        async function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                dest = audioCtx.createMediaStreamDestination();
            }
        }

        document.getElementById('btn-mic').onclick = async () => {
            await initAudio();
            const btn = document.getElementById('btn-mic');
            if (!isMicOn) {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx.createMediaStreamSource(micStream).connect(dest);
                btn.innerText = "Matikan Mic"; btn.classList.replace('bg-gray-700', 'bg-green-600');
                isMicOn = true;
            } else {
                micStream.getTracks().forEach(t => t.stop());
                btn.innerText = "Aktifkan Mic"; btn.classList.replace('bg-green-600', 'bg-gray-700');
                isMicOn = false;
            }
        };

        document.getElementById('btn-music').onclick = async () => {
            await initAudio();
            const btn = document.getElementById('btn-music');
            if (!isMusicOn) {
                const file = document.getElementById('audio-file').files[0];
                if (!file) return alert("Pilih file!");
                musicTag = new Audio(URL.createObjectURL(file));
                audioCtx.createMediaElementSource(musicTag).connect(dest);
                audioCtx.createMediaElementSource(musicTag).connect(audioCtx.destination);
                musicTag.play();
                btn.innerText = "Hentikan Musik"; btn.classList.replace('bg-gray-700', 'bg-blue-600');
                isMusicOn = true;
            } else {
                musicTag.pause(); btn.innerText = "Putar Musik"; btn.classList.replace('bg-blue-600', 'bg-gray-700');
                isMusicOn = false;
            }
        };

        document.getElementById('start-broadcast').onclick = () => {
            if (peer) return;
            peer = new Peer(MY_FIXED_ID);
            peer.on('open', () => {
                document.getElementById('start-broadcast').innerText = "RADIO ONLINE";
                document.getElementById('start-broadcast').classList.replace('bg-green-700', 'bg-green-500');
            });
            peer.on('call', (call) => {
                call.answer(dest.stream);
                activeListeners.add(call.peer);
                document.getElementById('count').innerText = activeListeners.size;
                call.on('close', () => { activeListeners.delete(call.peer); document.getElementById('count').innerText = activeListeners.size; });
            });
        };
    </script>
</body>
</html>
